name: Build resume

on:
  push:
    branches: [main]
    paths: ['default/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          working_directory: default
          root_file: default.tex
      # Recruiter-friendly filename
      - run: mv default/default.pdf Aitzaz_Qadir_Resume.pdf
      # Replace the single "resume" release so only one ever exists
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete resume --cleanup-tag --yes || true
          gh release create resume Aitzaz_Qadir_Resume.pdf --title "Resume" --notes "Built from ${{ github.sha }}" --latest
