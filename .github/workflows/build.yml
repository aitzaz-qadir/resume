name: Build resume

on:
  push:
    branches: [main]
    paths: ['default/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          working_directory: default
          root_file: default.tex
      # Recruiter-friendly filename
      - run: mv default/default.pdf Aitzaz_Qadir_Resume.pdf
      # Overwrite the PDF in the single "resume" release; the tag never moves
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload resume Aitzaz_Qadir_Resume.pdf --clobber
          gh release edit resume --notes "Built from ${{ github.sha }}"
